<!DOCTYPE html>
<html lang="en" style="height: 100%;">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description"
            content="Control Panel for the MIS Streaming Integrated System">
        <title>Control Panel</title>
        <link rel="stylesheet" href="./main.css">
        <script type="module" src="./main.js"></script>

        <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1520.0.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    </head>



    
    <body style="background-color: rgb(44, 46, 56); padding-bottom: 2px; height: fit-content; min-height: 100%;">
        <div>
            <!-- Navigation Bar -->
            <header class="tabs tabs--standalone navbar" style="border-top: none; -webkit-app-region: drag; position: sticky; top: 0; z-index: 999;">
                <div role="tablist" class="hScroller" style="margin-left: 20px;">
                    <span class hScroller-scroll is-calculated id="navBar">
                        <span class="tabs-tab is-active" role="tab" id="pickColorPageTab">
                            Color Pallete
                        </span>
                        <span class="tabs-tab" role="tab" id="pickEventNameTab">
                            Announcement
                        </span>
                        <span class="tabs-tab" role="tab" id="pickStartingSoonPageTab">
                            Countdown
                        </span>
                        <span class="tabs-tab" role="tab" id="pickTeamScoresTab">
                            Team Scores
                        </span>
                        <span class="tabs-tab" role="tab" id="pickStopwatchTab">
                            Stopwatch
                        </span>
                    </span>
                </div>

                <div class="infoBar">
                    <span class="tabs-tab noHover" style="margin-right: 10px; margin-left: auto; margin-top: auto; margin-bottom: auto;" id="serverStatus"></span>
                    <input class="tabs-tab" style="margin-right: 5px; margin-left: 0px; margin-top: auto; margin-bottom: auto; cursor: text; border: 2px solid rgb(153, 153, 153); border-radius: 2px; height: 30px; margin-top: auto; margin-bottom: auto; color: black;" id="serverName">
                    <button class="button--primary button button--icon" style="width:fit-content; margin-bottom: auto; margin-right: 25px; background-color:#1E6FB3; border-color: #1E6FB3; margin-top: auto; height: 30px; -webkit-app-region: no-drag;"  id="resetValues">
                        <span>
                            Sync/Reset Values
                        </span>
                    </button>
                    <span class="tabs-tab noHover" style="border-bottom: none; font-size: 16px; padding-right: 5px; margin-right: 5px; margin-left: auto; margin-top: auto; margin-bottom: auto;">Remote Mode</span>
                    <label class="switch" style="margin-right: 25px;">
                        <input type="checkbox" id="slaveModeEnabled">
                        <span class="slider round"></span>
                    </label>
                    <button type="submit" class="button--primary button button--icon" id="saveValues" style="width:120px; margin-bottom: auto; margin-right: 5px; margin-top: auto; height: 30px; -webkit-app-region: no-drag; background-color: #264f71;">
                        <span>
                            Save Values
                        </span>
                    </button>
                </div>  
            </header>

            <ul class="tabPanes js-pageTabPanes page-panes" id="blurrableElement">
                <!-- Color Setter page -->
                <li id="colorPage" class="is-active">
                    <div class="block-container">
                        <div class="block-body file-upload-container">
                            <input id="file-upload" type="file">
                            <button class="button" style="margin: 10px;" id="upload-file-button" disabled>Upload Image</button>
                        </div>
                        <div class="block-body" id="colorDiv">
                            
                        </div>
                    </div>
                </li>

                <!-- Event Name Setter page-->
                <li id="eventName">
                    <div class="block-container">
                        <div class="block-body">
                            <dl class="formRow formRow--input">
                                <dt style="padding-top: 22px;">
                                    <div class="formRow-labelWrapper">
                                        <label class="formRow-label">Contents</label>
                                    </div>
                                </dt>
                                <dd>
                                    <div class="inputGroup inputGroup--joined">
                                        <input type="text" class="input texts t1" id="eventNameIs">
                                    </div>
                                </dd>
                            </dl>

                            <hr class="formRowSep">

                            <dl class="formRow formRow--input">
                                <dt style="padding-top: 22px;">
                                    <div class="formRow-labelWrapper">
                                        <label class="formRow-label">Position</label>
                                    </div>
                                </dt>
                                <dd>
                                    <div class="inputGroup inputGroup--joined">
                                        <select type="text" class="texts t1 eventScene_1 input" id="eventScene">
                                            <option value="gamePlay" selected="gamePlay" id="gamePlay">Bottom Left</option>
                                            <option value="startingSoon" selected="startingSoon" id="startingSoon">Top Left</option>
                                        </select>
                                    </div>
                                </dd>
                            </dl>

                            <hr class="formRowSep">

                            <dl class="formRow formRow--input">
                                <dt style="padding-top: 17px;">
                                    <div class="formRow-labelWrapper">
                                        <label class="formRow-label">Show Announcement</label>
                                    </div>
                                </dt>
                                <dd>
                                    <div class="inputGroup inputGroup--joined">
                                        <input type="checkbox" class="checks c1 clickToShow_1" id="showEvent" style="height: 30px; width: 30px">
                                    </div>
                                </dd>
                            </dl>
                        </div>
                    </div>
                </li>

                <!-- Starting Soon Setter page-->
                <li id="startingSoonPage">
                    <div class="block-container">
                        <div class="block-body">
                            <dl class="formRow formRow--input">
                                <dt style="padding-top: 22px;">
                                    <div class="formRow-labelWrapper">
                                        <label class="formRow-label">Event Title</label>
                                    </div>
                                </dt>
                                <dd>
                                    <div class="inputGroup inputGroup--joined">
                                        <input type="text" class="input texts t1" id="eventTitle">
                                    </div>
                                </dd>
                            </dl>

                            <hr class="formRowSep">

                            <dl class="formRow formRow--input">
                                <dt style="padding-top: 22px;">
                                    <div class="formRow-labelWrapper">
                                        <label class="formRow-label">Event Subtitle</label>
                                    </div>
                                </dt>
                                <dd>
                                    <div class="inputGroup inputGroup--joined">
                                        <input type="text" class="input texts t1" id="eventSubtitle">
                                    </div>
                                </dd>
                            </dl>

                            <hr class="formRowSep">

                            <dl class="formRow formRow--input">
                                <dt style="padding-top: 22px;">
                                    <div class="formRow-labelWrapper">
                                        <label class="formRow-label">Next Event</label>
                                    </div>
                                </dt>
                                <dd>
                                    <div class="inputGroup inputGroup--joined">
                                        <input type="text" class="input texts t1" id="nextEvent">
                                    </div>
                                </dd>
                            </dl>

                            <hr class="formRowSep">

                            <dl class="formRow formRow--input">
                                <dt style="padding-top: 22px;">
                                    <div class="formRow-labelWrapper">
                                        <label class="formRow-label">Start Time (24:00:00 Format)</label>
                                    </div>
                                </dt>
                                <dd>
                                    <div class="inputGroup inputGroup--joined">
                                        <input type="text" class="input texts t1" id="startTime">
                                    </div>
                                </dd>
                            </dl>

                            <hr class="formRowSep">

                            <dl class="formRow formRow--input">
                                <dt style="padding-top: 22px;">
                                    <div class="formRow-labelWrapper">
                                        <label class="formRow-label">Theme Color</label>
                                    </div>
                                </dt>
                                <dd>
                                    <div class="inputGroup inputGroup--joined">
                                        <!--<input type="text" class="input texts t1" id="themeSchool">-->
                                        <select type="text" class="input texts t1" style="width: 20%;" id="theme_color_school">
                                        </select>
                                        <select type="text" class="input texts t1" style="width: 20%;" id="theme_color_order">
                                            <option value="primary">Primary</option>
                                            <option value="secondary">Secondary</option>
                                        </select>
                                    </div>
                                </dd>
                            </dl>
                        </div>
                    </div>
                </li>

                <!-- Team Scores Setter page -->
                <li id="teamScores">
                    <div class="block-container">
                        <div class="block-body">
                            <dl class="formRow formRow--input">
                                <dt>
                                    <div class="formRow-labelWrapper">
                                        <label class="formRow-label">Game Scores</label>
                                    </div>
                                </dt>
                                <dd>
                                    <div class="inputGroup inputGroup--joined">
                                        <span class="inputGroup-text">Side 1 Name & Score</span>
                                        <input type="text" class="input texts t1" id="side_1-name-scores">
                                        <input type="number" class="input input--number js-numberBoxTextInput" min="0" id="side_1-score">
                                        <span class="inputGroup-splitter"></span>
                                        <div>
                                            <button type="button" class="button score" id="side_1-plusOne" style="height: 18px; width: 100%">+1</button>
                                            <button type="button" class="button score" id="side_1-minusOne" style="height: 18px; width: 100%;">-1</button>
                                        </div>
                                        <span class="inputGroup-splitter"></span>
                                        <div>
                                            <button type="button" class="button score" id="side_1-plusTwo" style="height: 18px; width: 100%;">+2</button>
                                            <button type="button" class="button score" id="side_1-minusTwo" style="height: 18px; width: 100%;">-2</button>
                                        </div>
                                        <span class="inputGroup-splitter"></span>
                                        <div>
                                            <button type="button" class="button score" id="side_1-plusThree" style="height: 18px; width: 100%;">+3</button>
                                            <button type="button" class="button score" id="side_1-minusThree" style="height: 18px; width: 100%;">-3</button>
                                        </div>
                                        <span class="inputGroup-splitter"></span>
                                        <span class="inputGroup-text">Theme</span>
                                        <select type="text" class="input texts t1" style="width: 20%;" id="side_1-theme">
                                        </select>
                                        <span class="inputGroup-text">Match</span>
                                        <div class="inputGroup-text">
                                            <input type="checkbox" class="checks c1 clickToShow_1" id="side_1-matchTheme" style="height: 20px; width: 20px">
                                        </div>
                                        <span class="inputGroup-splitter"></span>
                                        <span class="inputGroup-splitter"></span>
                                        <span class="inputGroup-splitter"></span>
                                        <span class="inputGroup-text">Fouls</span>
                                        <input type="number" class="input input--number js-numberBoxTextInput" min="0" id="side_1-fouls">
                                        <span class="inputGroup-splitter"></span>
                                        <span class="inputGroup-text">Timeouts</span>
                                        <input type="number" class="input input--number js-numberBoxTextInput" min="0" id="side_1-timeouts">
                                        <span class="inputGroup-splitter"></span>
                                        <button type="button" class="button score" id="side_1-zero" style="height: 100%; width: 5%; margin-top: auto; margin-bottom: auto;">Zero</button>
                                    </div>
                                    <div class="inputGroup inputGroup--joined">
                                        <span class="inputGroup-text">Side 2 Name & Score</span>
                                        <input type="text" class="input texts t1" id="side_2-name-scores">
                                        <input type="number" class="input input--number js-numberBoxTextInput" min="0" id="side_2-score">
                                        <span class="inputGroup-splitter"></span>
                                        <div>
                                            <button type="button" class="button score" id="side_2-plusOne" style="height: 18px; width: 100%">+1</button>
                                            <button type="button" class="button score" id="side_2-minusOne" style="height: 18px; width: 100%;">-1</button>
                                        </div>
                                        <span class="inputGroup-splitter"></span>
                                        <div>
                                            <button type="button" class="button score" id="side_2-plusTwo" style="height: 18px; width: 100%;">+2</button>
                                            <button type="button" class="button score" id="side_2-minusTwo" style="height: 18px; width: 100%;">-2</button>
                                        </div>
                                        <span class="inputGroup-splitter"></span>
                                        <div>
                                            <button type="button" class="button score" id="side_2-plusThree" style="height: 18px; width: 100%;">+3</button>
                                            <button type="button" class="button score" id="side_2-minusThree" style="height: 18px; width: 100%;">-3</button>
                                        </div>
                                        <span class="inputGroup-splitter"></span>
                                        <span class="inputGroup-text">Theme</span>
                                        <select type="text" class="input texts t1" style="width: 20%;" id="side_2-theme">
                                        </select>
                                        <span class="inputGroup-text">Match</span>
                                        <div class="inputGroup-text">
                                            <input type="checkbox" class="checks c1 clickToShow_1" id="side_2-matchTheme" style="height: 20px; width: 20px">
                                        </div>
                                        <span class="inputGroup-splitter"></span>
                                        <span class="inputGroup-splitter"></span>
                                        <span class="inputGroup-splitter"></span>
                                        <span class="inputGroup-text">Fouls</span>
                                        <input type="number" class="input input--number js-numberBoxTextInput" min="0" id="side_2-fouls">
                                        <span class="inputGroup-splitter"></span>
                                        <span class="inputGroup-text">Timeouts</span>
                                        <input type="number" class="input input--number js-numberBoxTextInput" min="0" id="side_2-timeouts">
                                        <span class="inputGroup-splitter"></span>
                                        <button type="button" class="button score" id="side_2-zero" style="height: 100%; width: 5%; margin-top: auto; margin-bottom: auto;">Zero</button>
                                    </div>
                                </dd>
                            </dl>

                            <hr class="formRowSep">

                            <dl class="formRow formRow--input">
                                <dt style="padding-top: 22px;">
                                    <div class="formRow-labelWrapper">
                                        <label class="formRow-label">Game Name</label>
                                    </div>
                                </dt>
                                <dd>
                                    <div class="inputGroup inputGroup--joined">
                                        <input type="text" class="input texts t1" id="gameName">
                                    </div>
                                </dd>
                            </dl>

                            <hr class="formRowSep">

                            <dl class="formRow formRow--input">
                                <dt style="padding-top: 15px;">
                                    <div class="formRow-labelWrapper">
                                        <label class="formRow-label">Show Sections</label>
                                    </div>
                                </dt>
                                <dd style="display: flex; flex-direction: row; justify-content: flex-start; align-items: center; gap: 10px;" class="excludeDoubleDot">
                                    <label class="formRow-label">Scores</label>
                                    <input type="checkbox" class="checks c1 clickToShow_1" id="showGame" style="height: 20px; width: 20px">

                                    <label class="formRow-label" style="margin-left: 50px;">Bottom Bar</label>
                                    <input type="checkbox" class="checks c1 clickToShow_1" id="showStopwatch" style="height: 20px; width: 20px">
                                    
                                    <label class="formRow-label"  style="margin-left: 50px;">Basketball Stats</label>
                                    <input type="checkbox" class="checks c1 clickToShow_1" id="showBasketballStats" style="height: 20px; width: 20px">
                                </dd>
                            </dl>
                        </div>
                    </div>
                </li>

                <!-- Stopwatch Setter page-->
                <li id="stopwatch">
                    <div class="block-container">
                        <div class="block-body">
                            <dl class="formRow formRow--input">
                                <dt style="padding-top: 22px;">
                                    <div class="formRow-labelWrapper">
                                        <label class="formRow-label">Game Time</label>
                                    </div>
                                </dt>
                                <dd>
                                    <div class="inputGroup inputGroup--joined">
                                        <input type="text" class="input texts t1" id="valueMs">         
                                        <span class="inputGroup-splitter"></span>
                                        <button type="button" class="start button" id="startAndStop">Start</button>
                                        <span class="inputGroup-splitter"></span>
                                        <button type="button" class="reset button" id="reset">Reset</button>
                                    </div>
                                </dd>
                            </dl>

                            <hr class="formRowSep">

                            <dl class="formRow formRow--input">
                                <dt style="padding-top: 22px;">
                                    <div class="formRow-labelWrapper">
                                        <label class="formRow-label">Period Interval (Seconds)</label>
                                    </div>
                                </dt>
                                <dd>
                                    <div class="inputGroup inputGroup--joined">
                                        <input type="text" class="input texts t1" id="periodInterval">
                                    </div>
                                </dd>
                            </dl>

                            <hr class="formRowSep">

                            <dl class="formRow formRow--input">
                                <dt style="padding-top: 22px;">
                                    <div class="formRow-labelWrapper">
                                        <label class="formRow-label">Period Marker</label>
                                    </div>
                                </dt>
                                <dd>
                                    <div class="inputGroup inputGroup--joined">
                                        <input type="text" class="input texts t1" id="periodMark">
                                    </div>
                                </dd>
                            </dl>

                            <hr class="formRowSep">

                            <dl class="formRow formRow--input">
                                <dt style="padding-top: 17px;">
                                    <div class="formRow-labelWrapper">
                                        <label class="formRow-label">Count Down</label>
                                    </div>
                                </dt>
                                <dd>
                                    <div class="inputGroup inputGroup--joined">
                                        <input type="checkbox" class="checks c1 clickToShow_1" id="countingDown" style="height: 30px; width: 30px">
                                    </div>
                                </dd>
                            </dl>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </body>
</html>
